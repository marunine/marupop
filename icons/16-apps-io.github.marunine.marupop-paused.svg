<!-- The paused state of the icon beside it, for a tray item whose scanning is off: the
     same speech bubble, holding the two bars of a pause glyph in place of ポ. The
     substitution rather than a badge keeps the state readable at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48" fill="none">
  <style type="text/css" id="current-color-scheme">
.ColorScheme-Text {
  color:#232629;
}
  </style>
  <path style="fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round" class="ColorScheme-Text" d="M 9,6 H 39 A 6,6 0 0 1 45,12 V 28 A 6,6 0 0 1 39,34 H 21 L 12,42 V 34 H 9 A 6,6 0 0 1 3,28 V 12 A 6,6 0 0 1 9,6 Z"/>
  <rect style="fill:currentColor" class="ColorScheme-Text" x="16.0" y="12.0" width="5.0" height="17.0" rx="1.5"/>
  <rect style="fill:currentColor" class="ColorScheme-Text" x="27.0" y="12.0" width="5.0" height="17.0" rx="1.5"/>
</svg>
